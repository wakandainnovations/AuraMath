server.port=8081
server.error.include-message=always
server.error.include-binding-errors=always

# --- Hawkes self-exciting process (HawkesIntensityCalculator) ---
# Exponential-kernel decay rate, per HOUR (event times are rescaled to hours before
# estimation). Sets the excitation half-life (ln 2 / beta hours) and the stationarity
# ceiling on the infectivity factor alpha (0 <= alpha < beta). Raised from the historical
# 1.0 so bursty cascade-starters are not clipped at alpha = 1.0.
hawkes.beta=3.0

# --- Ask Engine (experimental, com.lit.fire.flame.nlq) ---
# Natural-language -> database + mathematician engine. Read-only, per-request target
# connections, skip-list aware, pluggable LLM. See docs/ask-engine/DESIGN.md.
# All keys below are optional; the defaults shown are applied when omitted.
#aura.ask.enabled=true
#aura.ask.max-rows=1000
#aura.ask.query-timeout-seconds=30
#aura.ask.connection-timeout-seconds=10
# Comma-separated tables always excluded from the schema and re-enforced at validation/execution.
#aura.ask.default-skip-tables=
# Audit logging & observability (F10). A structured JSON audit line is always written per request;
# these keys control optional persistence to AuraMath's OWN database (table is not auto-created — see
# the DDL in docs/ask-engine/DESIGN.md). Metrics are at GET /api/ask/admin/metrics.
#aura.ask.audit.persist=false
#aura.ask.audit.table=ask_audit_log
#aura.ask.llm-provider=claude
# Multi-database registry & cross-database answering (F12). AuraMath loads named target databases from
# this host file at startup (ask.db.<name>.* groups — see scripts/config.secrets.example); requests then
# send only a question (+ optional "databases" subset). max-databases caps fan-out per Ask.
#aura.ask.secrets-path=${user.home}/config.secrets
#aura.ask.max-databases=5
# Hourly schema cache (F13): a scheduled job introspects every registered database and stores its
# schema in a table in AuraMath's OWN database (auto-created); the Ask path then answers from the cache.
#aura.ask.schema-cache.enabled=true
#aura.ask.schema-cache.table=ask_schema_cache
#aura.ask.schema-cache.refresh-interval-ms=3600000
#aura.ask.schema-cache.fallback-to-live=true
# Formula-gap logging (F14): when the LLM has to compute a formula not in the code catalog, log it
# (and persist to a table in AuraMath's own database, auto-created) so it can be implemented later.
#aura.ask.formula-gap.persist=true
#aura.ask.formula-gap.table=ask_formula_gap
